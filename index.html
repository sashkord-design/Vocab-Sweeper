<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Angry Teacher - Analog Console Edition</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Space Grotesk & Space Mono -->
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #e8e2d0;
            color: #2b2b28;
            overflow-x: hidden;
            background-image: 
                linear-gradient(rgba(43, 43, 40, 0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(43, 43, 40, 0.08) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        .font-mono-retro {
            font-family: 'Space Mono', monospace;
        }

        /* Enable text selection */
        .selectable-text {
            user-select: text;
            -webkit-user-select: text;
        }

        /* Vintage Console Stripe */
        .console-stripe {
            background: linear-gradient(90deg, 
                #3b7080 0%, #3b7080 25%, 
                #d49e35 25%, #d49e35 50%, 
                #547b4b 50%, #547b4b 75%, 
                #c04838 75%, #c04838 100%);
            height: 6px;
        }

        /* Card Styling - Synthesizer / Mixer Knob Key Style */
        .card-item {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.75rem;
            background: #f4efdf;
            border: 2.5px solid #2b2b28;
            box-shadow: 4px 4px 0 0 #2b2b28;
            transition: all 0.15s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card-wrapper:hover .card-item {
            background: #d49e35;
            color: #f4efdf;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0 0 #2b2b28;
        }

        .card-wrapper:hover .card-item span {
            color: #2b2b28;
        }

        .card-wrapper:active .card-item {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #2b2b28;
        }

        .card-item.correct {
            background: #547b4b;
            border: 2.5px solid #2b2b28;
            box-shadow: 4px 4px 0 0 #2b2b28;
        }

        .card-item.correct span {
            color: #f4efdf !important;
        }

        /* Explosion scatter animation effect */
        .card-wrapper.exploded {
            animation: explode 0.8s ease-out forwards;
            pointer-events: none;
        }

        @keyframes explode {
            0% {
                transform: translate(0, 0) rotate(0deg) scale(1);
                opacity: 1;
            }
            100% {
                transform: translate(var(--tw-translate-x), var(--tw-translate-y)) rotate(var(--tw-rotate)) scale(0);
                opacity: 0;
            }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: #9e9786;
            border-radius: 4px;
        }

        /* Responsive grid adjustments */
        .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
        .grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
        .grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
        .grid-7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
        .grid-8 { grid-template-columns: repeat(8, minmax(0, 1fr)); }
    </style>
</head>

    </header>

    </main>

        /* ==========================================================================
           2. ADVANCED MULTI-TRACK 8-BIT AUDIO ENGINE
           ========================================================================== */
        class AudioEngine {
            constructor() {
                this.ctx = null;
                this.preferredVoice = null;
                this.isBgmPlaying = false;
                this.bgmTimer = null;
                this.bgmStep = 0;
                this.activeSentenceSpeechBtn = null;
                this.initVoices();
            }

            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
            }

            initVoices() {
                if (!('speechSynthesis' in window)) return;
                
                const selectMaleVoice = () => {
                    const voices = window.speechSynthesis.getVoices();
                    const maleVoice = voices.find(v => 
                        v.lang.startsWith('en') && 
                        (v.name.includes('Male') || v.name.includes('Daniel') || v.name.includes('George') || v.name.includes('David') || v.name.includes('Alex') || v.name.includes('Oliver') || v.name.includes('Google UK English Male'))
                    );

                    if (maleVoice) {
                        this.preferredVoice = maleVoice;
                    } else {
                        const anyEnglish = voices.find(v => v.lang.startsWith('en'));
                        this.preferredVoice = anyEnglish || null;
                    }
                };

                selectMaleVoice();
                if (window.speechSynthesis.onvoiceschanged !== undefined) {
                    window.speechSynthesis.onvoiceschanged = selectMaleVoice;
                }
            }

            toggleBGM() {
                this.init();
                this.isBgmPlaying = !this.isBgmPlaying;

                if (this.isBgmPlaying) {
                    this.startBGM();
                } else {
                    this.stopBGM();
                }

                return this.isBgmPlaying;
            }

            startBGM() {
                if (this.bgmTimer) clearInterval(this.bgmTimer);
                
                const bassline = [
                    110, 110, 164.8, 110, 130.8, 130.8, 196, 130.8,
                    146.8, 146.8, 220, 146.8, 123.5, 123.5, 146.8, 123.5,
                    87.3, 87.3, 130.8, 87.3, 98, 98, 146.8, 98,
                    110, 110, 164.8, 110, 164.8, 196, 220, 246.9,
                    110, 0, 220, 110, 130.8, 0, 261.6, 130.8,
                    146.8, 0, 293.6, 146.8, 164.8, 196, 220, 246.9,
                    55, 55, 110, 55, 65.4, 65.4, 130.8, 65.4,
                    73.4, 73.4, 146.8, 73.4, 82.4, 98, 110, 123.5
                ];

                const leadMelody = [
                    440, 523.2, 659.2, 523.2, 587.3, 659.2, 783.9, 659.2,
                    698.4, 783.9, 880, 783.9, 587.3, 523.2, 440, 349.2,
                    880, 659.2, 523.2, 440, 783.9, 587.3, 493.8, 392,
                    659.2, 523.2, 440, 329.6, 587.3, 493.8, 392, 293.6,
                    880, 1046.5, 880, 659.2, 783.9, 880, 783.9, 523.2,
                    698.4, 880, 698.4, 587.3, 659.2, 783.9, 880, 987.7,
                    440, 0, 523.2, 0, 392, 0, 440, 0,
                    349.2, 0, 440, 0, 329.6, 0, 392, 0
                ];

                const arpNotes = [
                    880, 1046.5, 1318.5, 1046.5, 698.4, 880, 1046.5, 880,
                    783.9, 987.7, 1174.7, 987.7, 659.2, 783.9, 987.7, 783.9,
                    698.4, 880, 1046.5, 880, 587.3, 698.4, 880, 698.4,
                    523.2, 659.2, 783.9, 659.2, 440, 523.2, 659.2, 523.2,
                    880, 1318.5, 1046.5, 1318.5, 783.9, 1174.7, 987.7, 1174.7,
                    698.4, 1046.5, 880, 1046.5, 659.2, 987.7, 783.9, 987.7,
                    440, 659.2, 523.2, 659.2, 392, 587.3, 493.8, 587.3,
                    349.2, 523.2, 440, 523.2, 329.6, 493.8, 392, 493.8
                ];

                const bpm = 150;
                const intervalMs = (60 / bpm) * 1000 / 2;

                this.bgmTimer = setInterval(() => {
                    if (!this.isBgmPlaying || !this.ctx) return;
                    const now = this.ctx.currentTime;
                    const totalSteps = bassline.length;
                    const step = this.bgmStep % totalSteps;

                    const bFreq = bassline[step];
                    if (bFreq > 0) {
                        const oscB = this.ctx.createOscillator();
                        const gainB = this.ctx.createGain();
                        oscB.type = 'sawtooth';
                        oscB.frequency.setValueAtTime(bFreq, now);

                        const filter = this.ctx.createBiquadFilter();
                        filter.type = 'lowpass';
                        filter.frequency.setValueAtTime(450, now);

                        gainB.gain.setValueAtTime(0.04, now);
                        gainB.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                        oscB.connect(filter);
                        filter.connect(gainB);
                        gainB.connect(this.ctx.destination);

                        oscB.start(now);
                        oscB.stop(now + 0.14);
                    }

                    const lFreq = leadMelody[step];
                    if (lFreq > 0) {
                        const oscL = this.ctx.createOscillator();
                        const gainL = this.ctx.createGain();
                        oscL.type = 'square';
                        oscL.frequency.setValueAtTime(lFreq, now);

                        gainL.gain.setValueAtTime(0.018, now);
                        gainL.gain.exponentialRampToValueAtTime(0.001, now + 0.12);

                        oscL.connect(gainL);
                        gainL.connect(this.ctx.destination);

                        oscL.start(now);
                        oscL.stop(now + 0.12);
                    }

                    const aFreq = arpNotes[step];
                    if (aFreq > 0) {
                        const oscA = this.ctx.createOscillator();
                        const gainA = this.ctx.createGain();
                        oscA.type = 'triangle';
                        oscA.frequency.setValueAtTime(aFreq, now);

                        gainA.gain.setValueAtTime(0.012, now);
                        gainA.gain.exponentialRampToValueAtTime(0.0005, now + 0.08);

                        oscA.connect(gainA);
                        gainA.connect(this.ctx.destination);

                        oscA.start(now);
                        oscA.stop(now + 0.08);
                    }

                    if (step % 2 === 0) {
                        const noiseBuf = this.ctx.createBuffer(1, this.ctx.sampleRate * 0.025, this.ctx.sampleRate);
                        const output = noiseBuf.getChannelData(0);
                        for (let i = 0; i < noiseBuf.length; i++) {
                            output[i] = Math.random() * 2 - 1;
                        }

                        const noiseSrc = this.ctx.createBufferSource();
                        noiseSrc.buffer = noiseBuf;

                        const hf = this.ctx.createBiquadFilter();
                        hf.type = 'highpass';
                        hf.frequency.setValueAtTime(5000, now);

                        const ng = this.ctx.createGain();
                        ng.gain.setValueAtTime(step % 4 === 0 ? 0.012 : 0.005, now);
                        ng.gain.exponentialRampToValueAtTime(0.0001, now + 0.025);

                        noiseSrc.connect(hf);
                        hf.connect(ng);
                        ng.connect(this.ctx.destination);

                        noiseSrc.start(now);
                    }

                    this.bgmStep++;
                }, intervalMs);
            }

            stopBGM() {
                if (this.bgmTimer) {
                    clearInterval(this.bgmTimer);
                    this.bgmTimer = null;
                }
            }

            playCorrectCard() {
                this.init();
                const now = this.ctx.currentTime;
                
                const osc1 = this.ctx.createOscillator();
                const gain1 = this.ctx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now);
                osc1.frequency.exponentialRampToValueAtTime(783.99, now + 0.08);
                gain1.gain.setValueAtTime(0.3, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc1.connect(gain1);
                gain1.connect(this.ctx.destination);
                osc1.start(now);
                osc1.stop(now + 0.15);

                const osc2 = this.ctx.createOscillator();
                const gain2 = this.ctx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(1046.50, now + 0.05);
                gain2.gain.setValueAtTime(0.2, now + 0.05);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc2.connect(gain2);
                gain2.connect(this.ctx.destination);
                osc2.start(now + 0.05);
                osc2.stop(now + 0.2);
            }

            playExplosion() {
                this.init();
                const now = this.ctx.currentTime;

                const subOsc = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                subOsc.type = 'triangle';
                subOsc.frequency.setValueAtTime(160, now);
                subOsc.frequency.exponentialRampToValueAtTime(25, now + 0.9);

                subGain.gain.setValueAtTime(1.0, now);
                subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.9);

                subOsc.connect(subGain);
                subGain.connect(this.ctx.destination);
                subOsc.start(now);
                subOsc.stop(now + 0.9);

                const bufferSize = this.ctx.sampleRate * 1.0;
                const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                const data = buffer.getChannelData(0);

                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }

                const noise = this.ctx.createBufferSource();
                noise.buffer = buffer;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(1200, now);
                filter.frequency.exponentialRampToValueAtTime(20, now + 1.0);

                const noiseGain = this.ctx.createGain();
                noiseGain.gain.setValueAtTime(1.0, now);
                noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);

                noise.connect(filter);
                filter.connect(noiseGain);
                noiseGain.connect(this.ctx.destination);

                noise.start(now);
                noise.stop(now + 1.0);
            }

            playSuccess() {
                this.init();
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.06);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.06);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.06 + 0.3);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);

                    osc.start(this.ctx.currentTime + idx * 0.06);
                    osc.stop(this.ctx.currentTime + idx * 0.06 + 0.3);
                });
            }

            toggleSpeech(text, onEndCallback) {
                if (!('speechSynthesis' in window)) return false;

                if (window.speechSynthesis.speaking) {
                    window.speechSynthesis.cancel();
                    if (this.currentSpeakingText === text) {
                        this.currentSpeakingText = null;
                        if (onEndCallback) onEndCallback(false);
                        return false;
                    }
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'en-US';
                utterance.rate = 0.88;
                utterance.pitch = 0.75;

                if (this.preferredVoice) {
                    utterance.voice = this.preferredVoice;
                }
                
                utterance.onend = () => {
                    this.currentSpeakingText = null;
                    if (onEndCallback) onEndCallback(false);
                };

                utterance.onerror = () => {
                    this.currentSpeakingText = null;
                    if (onEndCallback) onEndCallback(false);
                };

                this.currentSpeakingText = text;
                window.speechSynthesis.speak(utterance);
                if (onEndCallback) onEndCallback(true);
                return true;
            }

            stopSpeech() {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                }
                this.currentSpeakingText = null;
            }
        }

        class VocabSweeperGame {
            constructor() {
                this.levels = [
                    { level: 1, size: 4, count: 16 },
                    { level: 2, size: 5, count: 25 },
                    { level: 3, size: 6, count: 36 },
                    { level: 4, size: 7, count: 49 },
                    { level: 5, size: 8, count: 64 }
                ];
                this.currentLevelIdx = 0;

                this.gridWords = [];
                this.unrevealedWords = [];
                this.targetWord = null;
                this.revealedCount = 0;
                this.isGameOver = false;
                this.isRoundActive = false;
                this.selectedCardData = null;

                // Timer parameters
                this.timeLeft = 25;
                this.timerInterval = null;

                // Elements
                this.gridEl = document.getElementById('game-grid');
                this.targetDefEl = document.getElementById('target-definition');
                this.levelBadge = document.getElementById('level-badge');
                this.progressBadge = document.getElementById('progress-badge');
                this.modalOverlay = document.getElementById('modal-overlay');
                this.examplesContentEl = document.getElementById('examples-content');
                this.btnSpeakTarget = document.getElementById('btn-speak-target');
                this.btnNextTarget = document.getElementById('btn-next-target');
                this.timerTextEl = document.getElementById('timer-text');
                this.timerBadgeEl = document.getElementById('timer-badge');

                this.initEvents();
            }

            shuffle(array) {
                const arr = [...array];
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            getPoolForLevel(levelIdx) {
                if (levelIdx === 0) {
                    return [...VOCAB_DATABASE.b1];
                } else if (levelIdx === 1) {
                    return [...VOCAB_DATABASE.b1, ...VOCAB_DATABASE.advanced];
                } else {
                    return [...VOCAB_DATABASE.advanced];
                }
            }

            startLevel(levelIdx = 0) {
                this.currentLevelIdx = levelIdx;
                this.isGameOver = false;
                this.stopTimer();
                soundEngine.stopSpeech();
                this.selectedCardData = null;
                this.resetExamplesPanel();

                const levelConfig = this.levels[this.currentLevelIdx];

                this.levelBadge.textContent = `${levelConfig.level} (${levelConfig.size}x${levelConfig.size})`;
                this.revealedCount = 0;
                this.updateProgressBadge();

                let currentPool = this.getPoolForLevel(this.currentLevelIdx);
                while (currentPool.length < levelConfig.count) {
                    currentPool = currentPool.concat(this.getPoolForLevel(this.currentLevelIdx));
                }

                const shuffledPool = this.shuffle(currentPool);
                this.gridWords = shuffledPool.slice(0, levelConfig.count);
                this.unrevealedWords = [...this.gridWords];

                this.renderGrid(levelConfig.size);

                // Show instruction only at start of level
                this.targetWord = null;
                this.isRoundActive = false;
                this.targetDefEl.textContent = "Click the right arrow [ -> ] to load the first definition and start 25s timer!";
                this.timerTextEl.textContent = "25s";
            }

            renderGrid(gridSize) {
                this.gridEl.innerHTML = '';
                this.gridEl.className = `grid gap-2 md:gap-3 w-full max-w-4xl transition-all duration-300 grid-${gridSize}`;

                this.gridWords.forEach((wordObj, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'card-wrapper h-24 sm:h-28 md:h-32 cursor-pointer';
                    wrapper.dataset.index = index;
                    wrapper.dataset.word = wordObj.word;

                    wrapper.innerHTML = `
                        <div class="card-item w-full h-full relative">
                            <span class="text-sm sm:text-base md:text-lg font-black text-[#2b2b28] tracking-wide break-all text-center">${wordObj.word}</span>
                            <button class="btn-card-speak hidden absolute top-2 right-2 text-[#f4efdf] bg-[#3b7080] hover:bg-[#2e5967] w-7 h-7 rounded-full items-center justify-center transition shadow border border-[#2b2b28]" title="Pronounce word">
                                <i class="fa-solid fa-volume-high text-xs"></i>
                            </button>
                        </div>
                    `;

                    wrapper.addEventListener('click', (e) => {
                        const speakBtn = e.target.closest('.btn-card-speak');
                        if (speakBtn) {
                            e.stopPropagation();
                            const textToSpeak = `${wordObj.word}. Definition: ${wordObj.definition}`;
                            soundEngine.toggleSpeech(textToSpeak, (isPlaying) => {
                                const icon = speakBtn.querySelector('i');
                                if (isPlaying) {
                                    icon.className = "fa-solid fa-stop text-xs";
                                    speakBtn.classList.add('bg-[#c04838]', 'text-white');
                                } else {
                                    icon.className = "fa-solid fa-volume-high text-xs";
                                    speakBtn.classList.remove('bg-[#c04838]', 'text-white');
                                }
                            });
                            return;
                        }

                        this.handleCardClick(wrapper, wordObj);
                    });

                    this.gridEl.appendChild(wrapper);
                });
            }

            resetExamplesPanel() {
                this.examplesContentEl.innerHTML = `<p class="text-[#7c7668] text-center not-italic font-mono-retro text-xs">Select a correctly guessed card on the grid to view example sentences here.</p>`;
            }

            updateExamplesPanel(wordObj) {
                this.selectedCardData = wordObj;
                
                const s1 = wordObj.sentences[0] || '';
                const s2 = wordObj.sentences[1] || '';
                const s3 = wordObj.sentences[2] || '';

                this.examplesContentEl.innerHTML = `
                    <div class="p-3 bg-[#f4efdf] rounded-xl border-2 border-[#2b2b28] shadow-[2px_2px_0_0_#2b2b28] relative group">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-[#c04838] not-italic block text-xs font-mono-retro">1. EXAMPLE</span>
                            <button class="btn-speak-sentence hover:scale-110 text-[#2b2b28] hover:text-[#c04838] p-1 transition" data-sentence="${encodeURIComponent(s1)}" title="Listen to Sentence">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                        </div>
                        <p class="leading-relaxed text-sm">"${s1}"</p>
                    </div>

                    <div class="p-3 bg-[#f4efdf] rounded-xl border-2 border-[#2b2b28] shadow-[2px_2px_0_0_#2b2b28] relative group">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-[#3b7080] not-italic block text-xs font-mono-retro">2. EXAMPLE</span>
                            <button class="btn-speak-sentence hover:scale-110 text-[#2b2b28] hover:text-[#3b7080] p-1 transition" data-sentence="${encodeURIComponent(s2)}" title="Listen to Sentence">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                        </div>
                        <p class="leading-relaxed text-sm">"${s2}"</p>
                    </div>

                    <div class="p-3 bg-[#f4efdf] rounded-xl border-2 border-[#2b2b28] shadow-[2px_2px_0_0_#2b2b28] relative group">
                        <div class="flex items-center justify-between mb-1">
                            <span class="font-bold text-[#547b4b] not-italic block text-xs font-mono-retro">3. EXAMPLE</span>
                            <button class="btn-speak-sentence hover:scale-110 text-[#2b2b28] hover:text-[#547b4b] p-1 transition" data-sentence="${encodeURIComponent(s3)}" title="Listen to Sentence">
                                <i class="fa-solid fa-volume-high text-sm"></i>
                            </button>
                        </div>
                        <p class="leading-relaxed text-sm">"${s3}"</p>
                    </div>
                `;

                const btns = this.examplesContentEl.querySelectorAll('.btn-speak-sentence');
                btns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const rawSentence = decodeURIComponent(btn.dataset.sentence);
                        const icon = btn.querySelector('i');

                        if (soundEngine.activeSentenceSpeechBtn && soundEngine.activeSentenceSpeechBtn !== btn) {
                            const oldIcon = soundEngine.activeSentenceSpeechBtn.querySelector('i');
                            if (oldIcon) oldIcon.className = "fa-solid fa-volume-high text-sm";
                        }

                        soundEngine.toggleSpeech(rawSentence, (isPlaying) => {
                            if (isPlaying) {
                                soundEngine.activeSentenceSpeechBtn = btn;
                                icon.className = "fa-solid fa-stop text-sm text-[#c04838]";
                            } else {
                                soundEngine.activeSentenceSpeechBtn = null;
                                icon.className = "fa-solid fa-volume-high text-sm";
                            }
                        });
                    });
                });
            }

            loadNextTarget() {
                if (this.isGameOver) return;

                if (this.unrevealedWords.length === 0) {
                    this.handleLevelCompleted();
                    return;
                }

                const randIdx = Math.floor(Math.random() * this.unrevealedWords.length);
                this.targetWord = this.unrevealedWords[randIdx];

                this.targetDefEl.classList.add('opacity-0');
                setTimeout(() => {
                    this.targetDefEl.textContent = this.targetWord.definition;
                    this.targetDefEl.classList.remove('opacity-0');
                }, 150);

                this.startTimer();
            }

            startTimer() {
                this.stopTimer();
                this.timeLeft = 25;
                this.isRoundActive = true;
                this.timerTextEl.textContent = `${this.timeLeft}s`;
                this.timerBadgeEl.classList.remove('bg-[#c04838]', 'text-[#f4efdf]');
                this.timerBadgeEl.classList.add('bg-[#d49e35]', 'text-[#2b2b28]');

                this.timerInterval = setInterval(() => {
                    this.timeLeft--;
                    this.timerTextEl.textContent = `${this.timeLeft}s`;

                    if (this.timeLeft <= 5) {
                        this.timerBadgeEl.classList.remove('bg-[#d49e35]', 'text-[#2b2b28]');
                        this.timerBadgeEl.classList.add('bg-[#c04838]', 'text-[#f4efdf]');
                    }

                    if (this.timeLeft <= 0) {
                        this.stopTimer();
                        this.handleExplosion();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) {
                    clearInterval(this.timerInterval);
                    this.timerInterval = null;
                }
                this.isRoundActive = false;
            }

            handleCardClick(cardWrapperEl, clickedWordObj) {
                if (this.isGameOver) return;

                if (!this.isRoundActive || !this.targetWord) {
                    return;
                }

                const cardItem = cardWrapperEl.querySelector('.card-item');

                if (cardItem.classList.contains('correct')) {
                    this.updateExamplesPanel(clickedWordObj);
                    return;
                }

                if (clickedWordObj.word === this.targetWord.word) {
                    this.stopTimer();
                    soundEngine.playCorrectCard();

                    cardItem.classList.add('correct');
                    const speakBtn = cardItem.querySelector('.btn-card-speak');
                    if (speakBtn) {
                        speakBtn.classList.remove('hidden');
                        speakBtn.classList.add('flex');
                    }

                    this.updateExamplesPanel(clickedWordObj);

                    this.unrevealedWords = this.unrevealedWords.filter(w => w.word !== clickedWordObj.word);
                    this.revealedCount++;
                    this.updateProgressBadge();

                    // Keep current definition visible until player clicks arrow
                    this.targetWord = null;
                    this.timerTextEl.textContent = "25s";

                    if (this.unrevealedWords.length === 0) {
                        setTimeout(() => {
                            this.handleLevelCompleted();
                        }, 400);
                    }

                } else {
                    this.stopTimer();
                    this.handleExplosion();
                }
            }

            handleExplosion() {
                this.isGameOver = true;
                this.stopTimer();
                soundEngine.stopSpeech();
                soundEngine.playExplosion();

                const wrappers = this.gridEl.querySelectorAll('.card-wrapper');
                wrappers.forEach(wrap => {
                    const x = (Math.random() - 0.5) * 800;
                    const y = (Math.random() - 0.5) * 800;
                    const rot = (Math.random() - 0.5) * 720;

                    wrap.style.setProperty('--tw-translate-x', `${x}px`);
                    wrap.style.setProperty('--tw-translate-y', `${y}px`);
                    wrap.style.setProperty('--tw-rotate', `${rot}deg`);

                    wrap.classList.add('exploded');
                });

                setTimeout(() => {
                    this.showModal(
                        'bg-[#c04838] text-[#f4efdf] border-[#2b2b28]',
                        '<i class="fa-solid fa-bomb"></i>',
                        'BOOM!!!',
                        'One mistake—and you’re a flaming steak.',
                        'TRY AGAIN',
                        () => this.startLevel(0)
                    );
                }, 800);
            }

            handleLevelCompleted() {
                this.stopTimer();
                soundEngine.playSuccess();
                const isLastLevel = this.currentLevelIdx >= this.levels.length - 1;

                if (isLastLevel) {
                    this.showModal(
                        'bg-[#547b4b] text-[#f4efdf] border-[#2b2b28]',
                        '<i class="fa-solid fa-trophy"></i>',
                        'GRAND VICTORY!',
                        'Congratulations! You successfully completed all 5 difficulty levels of Angry Teacher!',
                        'PLAY AGAIN',
                        () => this.startLevel(0)
                    );
                } else {
                    const nextLvl = this.currentLevelIdx + 2;
                    this.showModal(
                        'bg-[#3b7080] text-[#f4efdf] border-[#2b2b28]',
                        '<i class="fa-solid fa-circle-check"></i>',
                        `LEVEL ${this.currentLevelIdx + 1} CLEARED!`,
                        `Great job! Ready for level ${nextLvl} with a larger word grid?`,
                        `PROCEED TO LEVEL ${nextLvl}`,
                        () => this.startLevel(this.currentLevelIdx + 1)
                    );
                }
            }

            updateProgressBadge() {
                const total = this.levels[this.currentLevelIdx].count;
                this.progressBadge.textContent = `${this.revealedCount} / ${total}`;
            }

            showModal(iconStyle, iconHtml, title, message, btnText, onAction) {
                const iconEl = document.getElementById('modal-icon');
                const titleEl = document.getElementById('modal-title');
                const msgEl = document.getElementById('modal-message');
                const btnEl = document.getElementById('modal-action-btn');

                iconEl.className = `w-20 h-20 mx-auto rounded-full flex items-center justify-center text-4xl mb-4 shadow-[4px_4px_0_0_#2b2b28] border-3 ${iconStyle}`;
                iconEl.innerHTML = iconHtml;
                titleEl.textContent = title;
                msgEl.textContent = message;
                btnEl.textContent = btnText;

                btnEl.onclick = () => {
                    this.hideModal();
                    onAction();
                };

                this.modalOverlay.classList.remove('hidden');
                setTimeout(() => {
                    this.modalOverlay.classList.remove('opacity-0');
                    document.getElementById('modal-content').classList.remove('scale-90');
                }, 10);
            }

            hideModal() {
                this.modalOverlay.classList.add('opacity-0');
                document.getElementById('modal-content').classList.add('scale-90');
                setTimeout(() => {
                    this.modalOverlay.classList.add('hidden');
                }, 300);
            }

            initEvents() {
                document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
                    const sidebar = document.getElementById('sidebar');
                    sidebar.classList.toggle('hidden');
                });

                document.getElementById('btn-reset-game').addEventListener('click', () => {
                    this.startLevel(0);
                });

                const btnToggleBgm = document.getElementById('btn-toggle-bgm');
                const bgmIcon = document.getElementById('bgm-icon');
                const bgmText = document.getElementById('bgm-text');

                btnToggleBgm.addEventListener('click', () => {
                    const isPlaying = soundEngine.toggleBGM();
                    if (isPlaying) {
                        bgmIcon.className = "fa-solid fa-volume-high text-sm text-[#3b7080]";
                        bgmText.textContent = "BGM ON";
                        btnToggleBgm.classList.add('bg-[#3b7080]/10');
                    } else {
                        bgmIcon.className = "fa-solid fa-volume-xmark text-sm text-[#c04838]";
                        bgmText.textContent = "BGM OFF";
                        btnToggleBgm.classList.remove('bg-[#3b7080]/10');
                    }
                });

                this.btnSpeakTarget.addEventListener('click', () => {
                    if (!this.targetWord) return;
                    const textToSpeak = `Definition: ${this.targetWord.definition}`;
                    const iconEl = document.getElementById('target-speaker-icon');

                    soundEngine.toggleSpeech(textToSpeak, (isPlaying) => {
                        if (isPlaying) {
                            iconEl.className = "fa-solid fa-stop text-sm";
                            this.btnSpeakTarget.classList.add('bg-[#c04838]', 'text-white');
                        } else {
                            iconEl.className = "fa-solid fa-volume-high text-sm";
                            this.btnSpeakTarget.classList.remove('bg-[#c04838]', 'text-white');
                        }
                    });
                });

                this.btnNextTarget.addEventListener('click', () => {
                    this.loadNextTarget();
                });
            }
        }

        window.onload = () => {
            const game = new VocabSweeperGame();
            game.startLevel(0);
        };
    </script>
</body>
</html>
